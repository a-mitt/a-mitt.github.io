- date: 2026-10-22
  type: お知らせ
  text:
    ja: ページのいちばん下に、こやが住みはじめました。クリックやなでなでで反応します。
    en: Koya now lives at the very bottom of every page. Click or pet Koya to see a reaction!
    ko: 페이지 맨 아래에 코야가 살기 시작했습니다. 클릭하거나 쓰다듬으면 반응해요.
    zh: Koya住进了每个页面的最下方。点击或摸摸它会有反应哦。
    zh-tw: Koya住進了每個頁面的最下方。點擊或摸摸牠會有反應喔。
- date: 2026-10-22
  type: 予告
  text:
    ja: エクボを躍らせるサイトと、エクボの手足やこやの肉球を触れるサイトを作る予定です。
    en: "Coming: a site where you can make Dimple dance, and a site where you can touch Dimple's arms and legs and Koya's paw pads."
    ko: 에쿠보를 춤추게 하는 사이트와, 에쿠보의 손발이나 코야의 젤리를 만질 수 있는 사이트를 만들 예정입니다.
    zh: 预定制作让小酒窝跳舞的网站，以及可以摸小酒窝的手脚和Koya肉球的网站。
    zh-tw: 預定製作讓小酒窩跳舞的網站，以及可以摸小酒窩的手腳和Koya肉球的網站。
- date: 2026-10-21
  type: 予告
  work: dance-reigen
  text:
    ja: 霊幻のダンス中断モード、別のダンスモード、ただ止まって見てくれるモードを追加予定です。
    en: "Coming: a mode where Reigen pauses his dance, a different dance mode, and a mode where he just stands still and watches you."
    ko: 레이겐의 춤 중단 모드, 다른 춤 모드, 그냥 멈춰서 바라봐 주는 모드를 추가할 예정입니다.
    zh: 预定新增灵幻的舞蹈中断模式、另一种舞蹈模式、只是静静站着看着你的模式。
    zh-tw: 預定新增靈幻的舞蹈中斷模式、另一種舞蹈模式、只是靜靜站著看著你的模式。
- date: 2026-10-21
