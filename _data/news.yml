    en: Released Ver1.1 with bug fixes and usability improvements.
    ko: Ver1.1을 공개했습니다. 버그 수정 및 조작 개선 등.
    zh: 发布了Ver1.1，包含漏洞修复和操作改进等。
    zh-tw: 發布了Ver1.1，包含錯誤修正和操作改進等。
