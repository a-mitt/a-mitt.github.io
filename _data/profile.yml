links:
  - label: { ja: X（表垢）, en: X (main), ko: X (본계), zh: X（主号）, zh-tw: X（主帳） }
    handle: "@NLisei_Kotowari"
    url: https://x.com/NLisei_Kotowari
    avatar: /assets/img/icon-x-main.jpg
    badge: x
    desc:
      ja: 主にここにいます。投稿やお知らせはこちらが先です。
      en: I'm mostly here. Posts and announcements show up here first.
      ko: 주로 여기 있어요. 게시물과 공지는 여기가 먼저입니다.
      zh: 主要在这里活动。作品和公告会先在这里发布。
      zh-tw: 主要在這裡活動。作品和公告會先在這裡發布。
  - label: { ja: X（裏垢）, en: X (alt), ko: X (부계), zh: X（小号）, zh-tw: X（副帳） }
    handle: "@Lisei_lose_"
    url: https://x.com/Lisei_lose_
    avatar: /assets/img/icon-x-sub.jpg
    badge: x
    desc:
      ja: 成人向けやセンシティブをあげます。高卒済み18⤴︎の表記ある方のみ通します。
      en: Adult and sensitive content. I only approve accounts that state they're 18+ and out of high school.
      ko: 성인향・민감한 콘텐츠를 올립니다. 고졸 & 18세 이상 표기가 있는 분만 받습니다.
      zh: 发布成人向及敏感内容。仅通过注明已高中毕业且18岁以上的账号。
      zh-tw: 發布成人向及敏感內容。僅通過註明已高中畢業且18歲以上的帳號。
  - label: pixiv
