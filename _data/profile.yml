    url: https://www.pixiv.net/users/45276382
    logo: pixiv
    desc:
      ja: 作品のツイログや小説投稿、サンプル投稿などは主にここです。
      en: Mainly for tweet-log compilations, novels, and samples of my work.
      ko: 작품 트윗 로그, 소설 투고, 샘플 투고 등은 주로 여기입니다.
      zh: 作品的推文合集、小说投稿、样品投稿等主要在这里。
      zh-tw: 作品的推文合集、小說投稿、樣品投稿等主要在這裡。
