name: 裏世界
id: a-mitt
# 自己紹介（改行してOK）。en/ko/zh は訳。無い言語は日本語が出る
bio:
  ja: |
    れーれんあらららに狂っているオタク。絵と文字とゲームと動画を吐くことがある。
    このサイトは作ったものへのリンクや紹介・アプデ告知などのために作成されました。
    気軽にお気に入り登録してね。
  en: |
    An otaku who's gone crazy over Reigen Arataka. Sometimes spits out art, writing, games, and videos.
    This site is for links to, introductions of, and update notices for the things I make.
    Feel free to bookmark it!
  ko: |
    레이겐 아라타카에 미쳐 있는 오타쿠. 그림과 글과 게임과 영상을 토해낼 때가 있음.
    이 사이트는 제가 만든 것들의 링크와 소개・업데이트 공지 등을 위해 만들었습니다.
    부담 없이 즐겨찾기 해 주세요.
  zh: |
    为灵幻新隆疯狂的宅。偶尔会产出画、文字、游戏和视频。
    本站用于放置我的作品链接、介绍及更新公告等。
    欢迎随手收藏。
  zh-tw: |
    為靈幻新隆瘋狂的宅。偶爾會產出畫、文字、遊戲和影片。
    本站用於放置我的作品連結、介紹及更新公告等。
    歡迎隨手收藏。

