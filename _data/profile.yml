      en: A box for comments, requests, and reports. You can send anonymously — like Marshmallow.
      ko: 감상・리퀘스트・제보 등을 받는 상자입니다. 익명으로 보낼 수 있어요. 마시멜로 같은 것.
      zh: 接收感想、点梗、反馈等的提问箱。可匿名发送，类似棉花糖（Marshmallow）。
      zh-tw: 接收感想、點梗、回報等的提問箱。可匿名傳送，類似棉花糖（Marshmallow）。
