<!doctype html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // 表示言語：URLの ?lang= → 保存済みの選択 → ブラウザの言語 → 英語（未対応の言語のとき）
  (function () {
    var langs = {{ site.langs | jsonify }}, l = new URLSearchParams(location.search).get("lang");
    if (langs.indexOf(l) >= 0) { try { localStorage.setItem("lang", l); } catch (e) {} }
    else { try { l = localStorage.getItem("lang"); } catch (e) {} }
    if (langs.indexOf(l) < 0) {
      var n = (navigator.language || "ja").slice(0, 2).toLowerCase();
      l = langs.indexOf(n) >= 0 ? n : "en";
    }
    document.documentElement.dataset.lang = l;
    document.documentElement.lang = l === "zh" ? "zh-CN" : l;
  })();
</script>
{% seo %}
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{% include t.html v=site.title %}</a>
  <label class="lang">
    <span aria-hidden="true">🌐</span>
    <select id="lang-select" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh">中文</option>
    </select>
  </label>
</header>
<main>
{{ content }}
</main>
<footer class="site-footer">© {{ site.data.profile.name }} ({{ site.data.profile.id }})</footer>
<script>
  (function () {
    var sel = document.getElementById("lang-select"), root = document.documentElement;
    sel.value = root.dataset.lang;
    sel.addEventListener("change", function () {
      root.dataset.lang = sel.value;
      root.lang = sel.value === "zh" ? "zh-CN" : sel.value;
      try { localStorage.setItem("lang", sel.value); } catch (e) {}
    });
  })();
</script>
</body>
</html>
