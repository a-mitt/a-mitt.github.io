<!doctype html>
<html lang="ja" data-lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // 表示言語：URLの ?lang= → 保存済みの選択 → ブラウザの言語 → 英語（未対応の言語のとき）
  (function () {
    var langs = {{ site.langs | jsonify }}, l = new URLSearchParams(location.search).get("lang");
    if (langs.indexOf(l) >= 0) { try { localStorage.setItem("lang", l); } catch (e) {} }
    else { try { l = localStorage.getItem("lang"); } catch (e) {} }
    if (langs.indexOf(l) < 0) {
      var n = (navigator.language || "ja").toLowerCase();
      l = /^zh-(tw|hk|mo|hant)/.test(n) ? "zh-tw" : n.slice(0, 2);
      if (langs.indexOf(l) < 0) l = "en";
    }
    document.documentElement.dataset.lang = l;
    document.documentElement.lang = { zh: "zh-CN", "zh-tw": "zh-TW" }[l] || l;
  })();
</script>
<style>
/* 選んだ言語以外を隠す */
{% for l in site.langs %}html:not([data-lang="{{ l }}"]) [data-l="{{ l }}"]{% unless forloop.last %},{% endunless %}
{% endfor %}{ display: none !important; }
</style>
{% seo %}
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}"><img src="{{ '/favicon.png' | relative_url }}" alt="" width="28" height="28">{% include t.html v=site.title %}</a>
  <label class="lang">
    <span aria-hidden="true">🌐</span>
    <select id="lang-select" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh">简体中文</option>
      <option value="zh-tw">繁體中文</option>
    </select>
  </label>
</header>
<main>
{{ content }}
</main>
<footer class="site-footer">
  <p class="notice">{% include t.html v=site.data.profile.notice %}</p>
  <p>© {{ site.data.profile.name }} ({{ site.data.profile.id }})</p>
</footer>
<script>
  (function () {
    var sel = document.getElementById("lang-select"), root = document.documentElement;
    sel.value = root.dataset.lang;
    sel.addEventListener("change", function () {
      root.dataset.lang = sel.value;
      root.lang = { zh: "zh-CN", "zh-tw": "zh-TW" }[sel.value] || sel.value;
      try { localStorage.setItem("lang", sel.value); } catch (e) {}
    });
  })();
</script>
</body>
</html>
