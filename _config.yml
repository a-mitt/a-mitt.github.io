title: 裏世界の作品置き場
description: 裏世界（a-mitt）が作ったゲームやサイトの紹介・配布ページ
url: https://a-mitt.github.io
lang: ja
timezone: Asia/Tokyo

# 対応言語（先頭が基本の言語）
langs: [ja, en, ko, zh, zh-tw]

plugins:
  - jekyll-seo-tag

collections:
  works:
    output: true
    permalink: /works/:name/

logo: /assets/img/site-icon.png

defaults:
  - scope: { path: "" }
    values: { image: /assets/img/site-icon.png }   # SNSで共有したときの画像（作品ページは作品の画像）
  - scope: { type: works }
    values: { layout: work }

exclude: [README.md, _templates, tools, translation-check.md]
