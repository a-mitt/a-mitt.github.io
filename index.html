<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a-mitt Works</title>
<meta name="description" content="a-mitt が作ったサイトの一覧">
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --text: #22211f; --muted: #6b6860;
    --line: #e4e1d8; --accent: #3b5bdb; --tag: #eef1fb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --card: #212126; --text: #ecebe7; --muted: #a09d95;
      --line: #33333a; --accent: #8ea5ff; --tag: #2a2f45; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
  main { max-width: 880px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; letter-spacing: .02em; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: inherit;
    transition: transform .15s, border-color .15s; }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); }
  .emoji { font-size: 2rem; line-height: 1; }
  .card h2 { font-size: 1.1rem; margin: 0; }
  .card p { margin: 0; color: var(--muted); font-size: .92rem; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--tag); color: var(--accent); }
  .links { display: flex; gap: 12px; font-size: .85rem; }
  .links a { color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>a-mitt Works</h1>
  <p class="lead">作ったサイトの置き場です。</p>
  <div class="grid" id="list"></div>
  <footer>GitHub: <a href="https://github.com/a-mitt">@a-mitt</a></footer>
</main>
<script>
  // サイトを追加するときはここに1件足す
  const sites = [
    {
      title: "誕生日お祝いミニRPG",
      emoji: "🎂",
      url: "https://a-mitt.github.io/2026hpbr/",
      repo: "https://github.com/a-mitt/2026hpbr",
      desc: "ブラウザで遊べる小さなRPG。マップを歩いて、話したり調べたり。日本語 / English 対応。",
      tags: ["ゲーム", "Phaser 3", "Vite"],
    },
    {
      title: "ダンス霊幻",
      emoji: "🕺",
      url: "https://a-mitt.github.io/dance-reigen/",
      repo: "https://github.com/a-mitt/dance-reigen",
      desc: "霊幻が踊るだけのページ。BGM・ペンライト・タップでクラッカーや拍手、みんなのコメントも流れる。",
      tags: ["ネタ", "HTML 1ファイル", "GAS"],
    },
  ];

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("list").innerHTML = sites.map(s => `
    <article class="card">
      <div class="emoji">${s.emoji}</div>
      <h2><a href="${s.url}" style="color:inherit">${esc(s.title)}</a></h2>
      <p>${esc(s.desc)}</p>
      <div class="tags">${s.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>
      <div class="links"><a href="${s.url}">開く →</a>${s.repo ? `<a href="${s.repo}">ソース</a>` : ""}</div>
    </article>`).join("");
</script>
</body>
</html>
