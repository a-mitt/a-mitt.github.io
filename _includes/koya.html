{%- comment -%}
  ページ下のこや。パーツ画像は assets/koya/（元絵 2000x1458 を x280,y380 から 1420x1078 で切り出して半分に縮小）。
{%- endcomment -%}
{%- assign k = site.data.koya -%}
<div class="koya-stage" aria-hidden="true">
  <div class="koya-bubble" id="koya-bubble"></div>
  <div class="koya k-hidden" id="koya" title="こや">
    <svg viewBox="0 0 1420 1078" class="koya-svg">
      <g class="k-all">
        <g class="k-ear k-ear-l"><image href="{{ '/assets/koya/ear-left.webp' | relative_url }}" width="1420" height="1078"/></g>
        <g class="k-ear k-ear-r"><image href="{{ '/assets/koya/ear-right.webp' | relative_url }}" width="1420" height="1078"/></g>
        <!-- 体の続き（画面の下に隠れている部分。跳ねたときに見える） -->
        <path class="k-body-fill" d="M140 1040 L1253 1040 L1247 1074 C1182 1176 972 1320 696 1322 C420 1320 210 1176 146 1074 Z"/>
        <path d="M146 1074 C210 1176 420 1320 696 1322 C972 1320 1182 1176 1247 1074"/>
        <image href="{{ '/assets/koya/body.webp' | relative_url }}" width="1420" height="1078"/>
        <g class="k-open">
          <image href="{{ '/assets/koya/eyes-open.webp' | relative_url }}" width="1420" height="1078"/>
          <g class="k-pupils"><image href="{{ '/assets/koya/pupils.webp' | relative_url }}" width="1420" height="1078"/></g>
        </g>
        <image class="k-closed" href="{{ '/assets/koya/eyes-closed.webp' | relative_url }}" width="1420" height="1078"/>
        <image class="k-happy-eyes" href="{{ '/assets/koya/eyes-happy.webp' | relative_url }}" width="1420" height="1078"/>
        <path class="k-mouth-closed" d="M592 963 C605 985 638 982 657 950 C678 970 710 982 733 965"/>
        <g class="k-mouth-open">
          <path class="k-tongue" d="M612 966 C616 1000 640 1027 665 1025 C690 1022 705 995 708 973 C690 975 670 966 653 948 C640 960 625 966 612 966 Z"/>
          <path d="M588 940 C595 960 625 970 653 946 C675 962 710 976 734 972"/>
        </g>
      </g>
    </svg>
    <div class="koya-zzz"><span>z</span><span>z</span><span>Z</span></div>
  </div>
</div>
<script>
(function () {
  var LINES = {{ k.lines | jsonify }}, PET = {{ k.pet | jsonify }}, WAKE = {{ k.wake | jsonify }};
  var el = document.getElementById("koya"), bub = document.getElementById("koya-bubble");
  if (!el) return;
  var stage = el.parentNode, svg = el.querySelector("svg"), all = el.querySelector(".k-all"), pupils = el.querySelector(".k-pupils");
  var earL = el.querySelector(".k-ear-l"), earR = el.querySelector(".k-ear-r");
  var lang = function () { return document.documentElement.dataset.lang || "ja"; };
  var tr = function (o) { return o[lang()] || o.ja; };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var st = { asleep: false, pet: false, idleAt: Date.now(), shown: false };
  var set = function (cls, on) { el.classList.toggle(cls, on); };

  // 耳はばねで動かす（a: 角度, v: 速さ, t: 戻る角度）。外側に開く向きが + になるよう左耳は符号反転
  var ears = [{ g: earL, cx: 560, cy: 600, s: -1, a: 0, v: 0, t: 0 }, { g: earR, cx: 1060, cy: 740, s: 1, a: 0, v: 0, t: 0 }];
  function kick(i, power) { ears[i].v += power; }
  function frame(now) {
    var tSec = now / 1000;
    ears.forEach(function (e) {
      e.t = st.asleep ? 24 : st.pet ? 14 : 0;
      e.v += (e.t - e.a) * 0.08; e.v *= 0.82; e.a += e.v;
      e.g.setAttribute("transform", "rotate(" + (e.a * e.s).toFixed(2) + " " + e.cx + " " + e.cy + ")");
    });
    // ふわふわ呼吸（寝てるときはゆっくり大きめ）、なでなで中はゆらゆら
    var b = (Math.sin(tSec * (st.asleep ? 1.2 : 1.96)) + 1) / 2, sx = 1 + b * 0.012, sy = 1 + b * (st.asleep ? 0.04 : 0.03);
    var rot = st.pet ? Math.sin(tSec * 9) * 2.5 : 0;
    all.setAttribute("transform", "rotate(" + rot.toFixed(2) + " 710 1078) translate(710 1078) scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ") translate(-710 -1078)");
    requestAnimationFrame(frame);
  }

  // まばたき（ときどき2回）
  function blinkOnce() { set("k-blink", true); setTimeout(function () { set("k-blink", false); }, 130); }
  function blink() {
    if (!st.asleep && !st.pet && !el.classList.contains("k-happy")) { blinkOnce(); if (Math.random() < 0.35) setTimeout(blinkOnce, 280); }
    setTimeout(blink, rand(1200, 3600));
  }
  // 耳ぴくっ（左・右・両方）
  function twitch() {
    if (!st.asleep) {
      var r = Math.random();
      if (r < 0.4) kick(0, rand(5, 8)); else if (r < 0.8) kick(1, rand(5, 8)); else { kick(0, 6); kick(1, 6); }
    }
    setTimeout(twitch, rand(1500, 4000));
  }
  // 吹き出し＋口ぱくぱく
  var talkTimer;
  function say(text, ms) {
    bub.textContent = text;
    bub.classList.add("show");
    set("k-talk", true);
    clearTimeout(talkTimer);
    talkTimer = setTimeout(function () { bub.classList.remove("show"); set("k-talk", false); }, ms || 2200);
  }
  // 目が指・マウスを追う
  function look(x, y) {
    var r = svg.getBoundingClientRect();
    var dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height * 0.75);
    // 白目からはみ出さない範囲：左右 ±85、上 35・下 65
    var d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 200), ux = dx / d, uy = dy / d;
    pupils.setAttribute("transform", "translate(" + (ux * 85 * k).toFixed(1) + " " + (uy * (uy > 0 ? 65 : 35) * k).toFixed(1) + ")");
  }
  function wake() {
    st.idleAt = Date.now();
    if (st.asleep) { st.asleep = false; set("k-sleep", false); kick(0, 10); kick(1, 10); say(tr(WAKE), 1800); }
  }
  // しばらく放っておくと寝る
  setInterval(function () {
    if (st.shown && !st.asleep && Date.now() - st.idleAt > 25000) { st.asleep = true; set("k-sleep", true); bub.classList.remove("show"); }
  }, 2000);

  window.addEventListener("pointermove", function (e) { look(e.clientX, e.clientY); if (e.pointerType === "mouse") wake(); }, { passive: true });
  window.addEventListener("pointerdown", wake, { passive: true });
  window.addEventListener("scroll", function () { st.idleAt = Date.now(); }, { passive: true });

  // タップ：ぴょこっと跳ねる＋にっこり＋耳パタパタ＋ひとこと
  var happyTimer;
  el.addEventListener("click", function () {
    wake();
    st.pet = false; set("k-pet", false); petMoves = 0;
    set("k-pop", false); void el.offsetWidth; set("k-pop", true);
    set("k-happy", true); clearTimeout(happyTimer); happyTimer = setTimeout(function () { set("k-happy", false); }, 1300);
    [0, 140, 280, 420].forEach(function (ms, i) { setTimeout(function () { kick(0, i % 2 ? -9 : 12); kick(1, i % 2 ? -9 : 12); }, ms); });
    say(tr(LINES[Math.floor(Math.random() * LINES.length)]));
  });
  el.addEventListener("animationend", function () { set("k-pop", false); set("k-rise", false); });

  // なでなで（マウスを頭の上でうろうろ）
  var petMoves = 0, petReset;
  el.addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse") return;
    petMoves++;
    clearTimeout(petReset);
    petReset = setTimeout(function () { petMoves = 0; st.pet = false; set("k-pet", false); }, 600);
    if (petMoves > 30 && !st.pet) { st.pet = true; set("k-pet", true); say(tr(PET), 1600); }
  });

  // ページのいちばん下まで来たら、ぴょこっと出てくる（離れたらまた隠れる）
  function show(on) {
    if (on === st.shown) return;
    st.shown = on;
    set("k-hidden", !on);
    if (!on) { set("k-rise", false); bub.classList.remove("show"); }
    if (on) { st.idleAt = Date.now(); set("k-rise", true); setTimeout(function () { kick(0, 12); kick(1, 12); }, 450); }
  }
  function atBottom() {
    var r = stage.getBoundingClientRect();
    return r.bottom <= window.innerHeight + 2;
  }
  window.addEventListener("scroll", function () { show(atBottom()); }, { passive: true });
  window.addEventListener("resize", function () { show(atBottom()); });
  setInterval(function () { show(atBottom()); }, 300);

  // OSの「動きを減らす」設定に関係なく動かす（こやは作品の一部なので）
  requestAnimationFrame(frame); setTimeout(blink, 1200); setTimeout(twitch, 2000);
})();
</script>
